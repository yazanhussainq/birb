<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Speed Test</title>
<style>
  :root {
    --bg-1: #0f0c29;
    --bg-2: #302b63;
    --bg-3: #24243e;
    --accent: #ffd166;
    --danger: #ef476f;
    --wait: #26547c;
    --go: #06d6a0;
    --text: #f4f4f9;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
    background-size: 200% 200%;
    animation: gradientShift 12s ease infinite;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    width: 100%;
    max-width: 520px;
    text-align: center;
  }

  h1 {
    font-size: 1.9rem;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }

  .subtitle {
    opacity: 0.75;
    margin-bottom: 24px;
    font-size: 0.95rem;
  }

  .stage {
    position: relative;
    height: 320px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 15px 35px rgba(0,0,0,0.35);
    transition: background 0.15s ease, transform 0.08s ease;
    background: var(--wait);
    overflow: hidden;
  }

  .stage:active {
    transform: scale(0.985);
  }

  .stage.idle {
    background: linear-gradient(160deg, #3a3a5c, #1f1f38);
  }

  .stage.waiting {
    background: linear-gradient(160deg, var(--danger), #9c1249);
  }

  .stage.go {
    background: linear-gradient(160deg, var(--go), #049a76);
  }

  .stage.too-soon {
    background: linear-gradient(160deg, #ff6b6b, #b91c1c);
  }

  .stage-text {
    font-size: 1.5rem;
    font-weight: 700;
    padding: 0 20px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .stage-sub {
    margin-top: 10px;
    font-size: 0.95rem;
    opacity: 0.85;
    padding: 0 30px;
  }

  .result-time {
    font-size: 3.2rem;
    font-weight: 800;
    margin-top: 4px;
    letter-spacing: -1px;
  }

  .stats {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 22px;
  }

  .stat-box {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 14px 8px;
    backdrop-filter: blur(6px);
  }

  .stat-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.65;
    margin-bottom: 6px;
  }

  .stat-value {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--accent);
  }

  .history {
    margin-top: 22px;
    text-align: left;
    background: rgba(255,255,255,0.05);
    border-radius: 14px;
    padding: 14px 18px;
    max-height: 130px;
    overflow-y: auto;
  }

  .history h3 {
    margin: 0 0 8px 0;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.65;
  }

  .history ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .history li {
    background: rgba(255, 209, 102, 0.15);
    border: 1px solid rgba(255, 209, 102, 0.3);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent);
  }

  .history::-webkit-scrollbar {
    width: 6px;
  }
  .history::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
  }

  .reset-btn {
    margin-top: 18px;
    background: none;
    border: 1px solid rgba(255,255,255,0.25);
    color: var(--text);
    padding: 8px 18px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    opacity: 0.75;
    transition: opacity 0.2s, background 0.2s;
  }

  .reset-btn:hover {
    opacity: 1;
    background: rgba(255,255,255,0.1);
  }

  .empty-history {
    opacity: 0.5;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<div class="container">
  <h1>⚡ Reaction Speed Test</h1>
  <p class="subtitle">Click when the box turns green. Don't jump the gun!</p>

  <div id="stage" class="stage idle">
    <div id="stageText" class="stage-text">Click to Start</div>
    <div id="stageSub" class="stage-sub">Wait for green, then click as fast as you can</div>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-label">Last</div>
      <div id="lastTime" class="stat-value">–</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Best</div>
      <div id="bestTime" class="stat-value">–</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Average</div>
      <div id="avgTime" class="stat-value">–</div>
    </div>
  </div>

  <div class="history">
    <h3>Recent Attempts</h3>
    <ul id="historyList"><li class="empty-history" style="list-style:none;">No attempts yet</li></ul>
  </div>

  <button class="reset-btn" id="resetBtn">Reset Stats</button>
</div>

<script>
  const stage = document.getElementById('stage');
  const stageText = document.getElementById('stageText');
  const stageSub = document.getElementById('stageSub');
  const lastTimeEl = document.getElementById('lastTime');
  const bestTimeEl = document.getElementById('bestTime');
  const avgTimeEl = document.getElementById('avgTime');
  const historyList = document.getElementById('historyList');
  const resetBtn = document.getElementById('resetBtn');

  // States: 'idle', 'waiting', 'go', 'too-soon', 'result'
  let state = 'idle';
  let timeoutId = null;
  let startTime = 0;
  let attempts = [];

  function setStage(newState, text, sub) {
    state = newState;
    stage.className = 'stage ' + newState;
    stageText.innerHTML = text;
    stageSub.textContent = sub || '';
  }

  function startRound() {
    setStage('waiting', 'Wait for green...', 'Get ready...');
    const delay = 1500 + Math.random() * 3000; // 1.5s - 4.5s
    timeoutId = setTimeout(() => {
      startTime = performance.now();
      setStage('go', 'CLICK NOW!', '');
    }, delay);
  }

  function recordAttempt(ms) {
    attempts.push(ms);
    updateStats();
  }

  function updateStats() {
    if (attempts.length === 0) {
      lastTimeEl.textContent = '–';
      bestTimeEl.textContent = '–';
      avgTimeEl.textContent = '–';
      historyList.innerHTML = '<li class="empty-history" style="list-style:none;">No attempts yet</li>';
      return;
    }
    const last = attempts[attempts.length - 1];
    const best = Math.min(...attempts);
    const avg = Math.round(attempts.reduce((a,b) => a+b, 0) / attempts.length);

    lastTimeEl.textContent = last + ' ms';
    bestTimeEl.textContent = best + ' ms';
    avgTimeEl.textContent = avg + ' ms';

    historyList.innerHTML = attempts
      .slice(-10)
      .reverse()
      .map(t => `<li>${t} ms</li>`)
      .join('');
  }

  function ratingText(ms) {
    if (ms < 200) return "Lightning fast! ⚡";
    if (ms < 250) return "Excellent reflexes! 🔥";
    if (ms < 300) return "Great job! 👍";
    if (ms < 350) return "Pretty good!";
    if (ms < 450) return "Average speed.";
    return "Keep practicing!";
  }

  stage.addEventListener('click', () => {
    if (state === 'idle') {
      startRound();
    } else if (state === 'waiting') {
      // Clicked too soon
      clearTimeout(timeoutId);
      setStage('too-soon', 'Too Soon!', 'You clicked before it turned green. Click to try again.');
      state = 'too-soon-result';
    } else if (state === 'go') {
      const reactionTime = Math.round(performance.now() - startTime);
      recordAttempt(reactionTime);
      setStage('go', reactionTime + ' ms', ratingText(reactionTime) + ' Click to try again.');
      state = 'result';
    } else if (state === 'too-soon-result' || state === 'result') {
      setStage('idle', 'Click to Start', 'Wait for green, then click as fast as you can');
    }
  });

  resetBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    attempts = [];
    updateStats();
    clearTimeout(timeoutId);
    setStage('idle', 'Click to Start', 'Wait for green, then click as fast as you can');
  });
</script>

</body>
</html>
